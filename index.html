<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HoballaH jouets — catalogue boutique 2026–2027. Parcourez les jouets et contactez-nous pour commander." />
  <title>HoballaH jouets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=9" />
  <link rel="icon" href="images/favicon.ico" sizes="any" />
  <link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" sizes="180x180" />
</head>
<body>
  <a class="skip-link" href="#catalogue" data-i18n="skip">Skip to catalogue</a>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="HoballaH jouets">
        <img src="images/logo.png?v=7" alt="HoballaH jouets" class="brand-logo" width="180" height="110" />
      </a>
      <nav class="header-nav" aria-label="Primary">
        <a href="#catalogue" data-i18n="nav.catalog">Catalogue</a>
      </nav>
      <div class="header-actions">
        <a class="header-email" id="header-email" href="mailto:Nagi@arc.sn" data-i18n="contact.email">Email</a>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-brand">
      <div class="hero-media" aria-hidden="true">
        <img src="images/hero-atmosphere.jpg" alt="" class="hero-image" />
      </div>
      <div class="hero-content">
        <img src="images/logo.png?v=7" alt="HoballaH jouets" class="hero-logo" width="320" height="196" />
        <h1 id="hero-brand" class="visually-hidden">HoballaH jouets</h1>
        <p class="hero-tagline" data-i18n="hero.tagline">The 2026–2027 toy catalogue</p>
        <a class="btn btn-primary" href="#catalogue" data-i18n="hero.cta">View catalogue</a>
      </div>
    </section>

    <section class="catalog" id="catalogue" aria-labelledby="catalog-title">
      <div class="section-intro">
        <h2 id="catalog-title" data-i18n="catalog.title">Catalogue</h2>
        <p class="section-lede" data-i18n="catalog.lede">Browse our toys. To order, get in touch.</p>
      </div>

      <div class="category-rail" id="category-rail" role="tablist" aria-label="Categories"></div>

      <p class="catalog-count" id="catalog-count" aria-live="polite"></p>

      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <img src="images/logo.png?v=7" alt="HoballaH jouets" class="footer-logo" width="130" height="80" />
      <p class="footer-address" id="footer-address">69 Rue de Raffenel, Angle Rue De Thiong, Dakar — Sénégal</p>
      <div class="footer-phones" id="footer-phones">
        <a href="tel:+221338214581">+221.33.821.45.81</a>
        <a href="tel:+2218231979">+221.823.19.79</a>
      </div>
      <p class="footer-copy" data-i18n="footer.copy">© HoballaH jouets — 2026–2027 catalogue</p>
    </div>
  </footer>

  <div class="detail-overlay" id="detail-overlay" hidden>
    <div class="detail-backdrop" data-close-detail></div>
    <aside class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1">
      <button type="button" class="detail-close" data-close-detail aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
      <div class="detail-media">
        <img id="detail-image" src="" alt="" />
      </div>
      <div class="detail-body">
        <p class="detail-meta" id="detail-meta"></p>
        <h2 id="detail-title"></h2>
        <p class="detail-desc" id="detail-desc"></p>
        <div class="detail-actions">
          <a class="btn btn-primary" id="detail-email" href="mailto:Nagi@arc.sn" data-i18n="detail.email">Ask by email</a>
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
